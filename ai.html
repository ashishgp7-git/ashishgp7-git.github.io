<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InfraGenie AI</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1f2937;
      margin-bottom: 5px;
    }

    p {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      padding: 12px 22px;
      font-size: 14px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background-color: #1e4fd6;
    }

    .response-box {
      margin-top: 25px;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      white-space: pre-wrap;
      min-height: 80px;
      color: #111827;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>InfraGenie AI</h1>
    <p>Ask infrastructure, cloud, or DevOps questions</p>

    <textarea id="question" placeholder="Example: Why is Zabbix showing the same graph values for all time ranges?"></textarea>

    <br />
    <button id="askBtn" onclick="askAI()">Ask AI</button>

    <h3>Response</h3>
    <div id="response" class="response-box">
      Waiting for your question…
    </div>

    <div class="footer">
      Powered by AWS Lambda + Amazon Bedrock
    </div>
  </div>

  <script>
    async function askAI() {
      const question = document.getElementById("question").value.trim();
      const responseBox = document.getElementById("response");
      const askBtn = document.getElementById("askBtn");

      if (!question) {
        responseBox.innerText = "Please enter a question.";
        return;
      }

      responseBox.innerText = "Thinking...";
      askBtn.disabled = true;

      try {
        const res = await fetch(
          "https://nk7slyckdsffoc6r2pfmscb5ui0aiqvq.lambda-url.us-east-1.on.aws/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": "infragenie-secret-123"
            },
            body: JSON.stringify({ question })
          }
        );

        const data = await res.json();

        if (!res.ok) {
          responseBox.innerText =
            data.error || `Request failed (HTTP ${res.status})`;
        } else if (data.answer) {
          responseBox.innerText = data.answer;
        } else {
          responseBox.innerText = "Unexpected response format.";
        }

      } catch (error) {
        responseBox.innerText =
          "Unable to reach InfraGenie API. Please try again later.";
      } finally {
        askBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
